# poly-qwen-tts behind Caddy, which serves it over HTTPS with its own certificate.
#
#   cp .env.example .env      # set DOMAIN (and optionally auth, model settings, ...)
#   docker compose up -d --build
#
# Caddy gets a Let's Encrypt certificate for a public DOMAIN automatically (ports 80 and 443 must
# reach this host), or issues one from its own local CA for localhost, IP addresses and LAN-only
# names. The app itself is not published on any host port; only Caddy is.

services:
  app:
    build: .
    image: poly-qwen-tts:latest
    restart: unless-stopped
    environment:
      POLY_TTS_SERVE_ARGS: ${POLY_TTS_SERVE_ARGS:-}
      POLY_TTS_MAX_LOADED_MODELS: ${POLY_TTS_MAX_LOADED_MODELS:-3}
      POLY_TTS_AUTO_TRANSCRIBE: ${POLY_TTS_AUTO_TRANSCRIBE:-1}
      POLY_TTS_VC: ${POLY_TTS_VC:-auto}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/data/cache
      - library:/data/library
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/conf.d:/etc/caddy/conf.d:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  models:      # model weights (~13 GB for the three TTS models, plus Whisper and the converters)
  library:     # saved voices and presets
  caddy_data:  # certificates and keys: keep it, or Let's Encrypt rate limits may bite
  caddy_config:
