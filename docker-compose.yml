# poly-qwen-tts on an NVIDIA GPU, over plain HTTP.
#
#   cp .env.example .env      # optional: port, model settings, serve flags, ...
#   docker compose up -d --build
#   http://<host>:8000
#
# For HTTPS, use docker-compose.https.yml instead.

services:
  app:
    build: .
    image: poly-qwen-tts:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      POLY_TTS_SERVE_ARGS: ${POLY_TTS_SERVE_ARGS:-}
      POLY_TTS_MAX_LOADED_MODELS: ${POLY_TTS_MAX_LOADED_MODELS:-3}
      POLY_TTS_AUTO_TRANSCRIBE: ${POLY_TTS_AUTO_TRANSCRIBE:-1}
      POLY_TTS_VC: ${POLY_TTS_VC:-auto}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/data/cache
      - library:/data/library
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:      # model weights (~13 GB for the three TTS models, plus Whisper and the converters)
  library:     # saved voices and presets
